<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Biblioteca de Partituras</title>

<link rel="stylesheet" href="estilos.css">
</head>

<body data-theme="light">

<header>
  <h1>🎼 Biblioteca de Partituras</h1>

  <input type="text" id="buscador" placeholder="Buscar partituras...">

  <button id="themeToggle">🌙 Modo oscuro</button>
</header>

<div class="container">

  <div class="grid" id="grid"></div>

  <div class="visor">
    <iframe id="pdfFrame"></iframe>
  </div>

</div>

<script>
let data = [];

/* CARGA JSON */
fetch('data.json?v=2')
  .then(res => res.json())
  .then(json => {
    data = json;
    render(data);
  })
  .catch(err => console.log("ERROR JSON:", err));

/* RENDER */
function render(lista) {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  lista.forEach(p => {

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="cover">🎼</div>

      <div class="info">
        <div class="titulo">${p.titulo || ""}</div>
        <div class="compositor">${p.compositor || ""}</div>
      </div>
    `;

    div.onclick = () => verPDF(p.url);

    grid.appendChild(div);
  });
}

/* BUSCADOR */
document.getElementById("buscador").addEventListener("input", function() {
  let v = this.value.toLowerCase();

  render(data.filter(p =>
    (p.titulo || "").toLowerCase().includes(v) ||
    (p.compositor || "").toLowerCase().includes(v)
  ));
});

/* VISOR */
function verPDF(url) {
  let match = url.match(/\/d\/(.*?)\//);

  if (match) {
    document.getElementById("pdfFrame").src =
      "https://drive.google.com/file/d/" + match[1] + "/preview";
  }
}

/* TEMA */
const btn = document.getElementById("themeToggle");

function setTheme(t) {
  document.body.setAttribute("data-theme", t);
  localStorage.setItem("theme", t);

  btn.textContent = t === "dark"
    ? "☀️ Modo claro"
    : "🌙 Modo oscuro";
}

setTheme(localStorage.getItem("theme") || "light");

btn.onclick = () => {
  let current = document.body.getAttribute("data-theme");
  setTheme(current === "dark" ? "light" : "dark");
};
</script>

</body>
</html>
