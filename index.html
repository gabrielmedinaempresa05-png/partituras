<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Biblioteca de Partituras</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #141414;
  color: white;
}

/* HEADER */
header {
  padding: 20px;
  text-align: center;
  background: #1f1f1f;
}

h1 {
  margin: 0;
  font-size: 24px;
}

#buscador {
  margin-top: 10px;
  width: 60%;
  padding: 10px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

/* LAYOUT */
.container {
  display: flex;
  height: calc(100vh - 120px);
}

/* GRID estilo Netflix */
.grid {
  width: 55%;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 15px;
  padding: 15px;
  overflow-y: auto;
}

/* TARJETAS */
.card {
  background: #222;
  padding: 10px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;
}

.card:hover {
  transform: scale(1.05);
  background: #333;
}

.titulo {
  font-size: 14px;
  font-weight: bold;
}

.compositor {
  font-size: 12px;
  color: #aaa;
}

/* VISOR */
.visor {
  width: 45%;
  background: #000;
  padding: 10px;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
  border-radius: 8px;
}
</style>
</head>

<body>

<header>
  <h1>🎼 Biblioteca de Partituras</h1>
  <input type="text" id="buscador" placeholder="Buscar...">
</header>

<div class="container">

  <!-- GRID -->
  <div class="grid" id="grid"></div>

  <!-- VISOR -->
  <div class="visor">
    <iframe id="pdfFrame"></iframe>
  </div>

</div>

<script>
let data = [];

fetch('data.json')
  .then(res => res.json())
  .then(json => {
    data = json;
    render(data);
  });

function render(lista) {
  let grid = document.getElementById("grid");
  grid.innerHTML = "";

  lista.forEach(p => {
    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="titulo">${p.titulo}</div>
      <div class="compositor">${p.compositor || ""}</div>
    `;

    div.onclick = () => verPDF(p.url);

    grid.appendChild(div);
  });
}

/* BUSCADOR */
document.getElementById("buscador").addEventListener("input", function() {
  let v = this.value.toLowerCase();

  let filtrado = data.filter(p =>
    p.titulo.toLowerCase().includes(v) ||
    (p.compositor || "").toLowerCase().includes(v)
  );

  render(filtrado);
});

/* VISOR PDF */
function verPDF(url) {
  let match = url.match(/\/d\/(.*?)\//);

  if (match) {
    document.getElementById("pdfFrame").src =
      "https://drive.google.com/file/d/" + match[1] + "/preview";
  } else {
    document.getElementById("pdfFrame").src = url;
  }
}
</script>

</body>
</html>
