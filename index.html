<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<title>Biblioteca de Partituras</title>
<link rel="stylesheet" href="estilos.css">
</head>

<body>

<header>
  <h1>🎼 Biblioteca de Partituras</h1>
  <input type="text" id="buscador" placeholder="Buscar...">
  <div id="ruta">📁 Inicio</div>
</header>

<div class="container">

  <!-- 📂 EXPLORADOR -->

  <div class="explorador">
    <button id="btnAtras">⬅ Volver</button>
    <div id="lista"></div>
  </div>

  <!-- 📑 VISOR -->

  <div class="visor">
    <iframe id="pdfFrame"></iframe>
  </div>

</div>

<script>
let data = [];
let estructura = {};
let rutaActual = [];
let carpetaActual = null;

/* 📦 CARGA SEGURA */
fetch('./data.json?v=' + Date.now())
  .then(res => res.json())
  .then(json => {
    data = json;
    construirEstructura();
    mostrarCarpeta();
  })
  .catch(err => {
    console.error(err);
    document.getElementById("grid").innerHTML = "Error cargando datos";
  });

/* 🧠 CONSTRUIR ÁRBOL REAL */
function construirEstructura() {
  estructura = {};

  data.forEach(item => {
    let partes = (item.carpeta || "General").split("/");
    let nodo = estructura;

    partes.forEach(parte => {
      if (!nodo[parte]) {
        nodo[parte] = {
          subcarpetas: {},
          archivos: []
        };
      }
      nodo = nodo[parte].subcarpetas;
    });

    // meter archivo en la carpeta final
    let ultima = partes[partes.length - 1];
    let carpetaPadre = getNodoPadre(partes);
    carpetaPadre[ultima].archivos.push(item);
  });
}

/* 🔍 obtener nodo padre */
function getNodoPadre(partes) {
  let nodo = estructura;
  for (let i = 0; i < partes.length - 1; i++) {
    nodo = nodo[partes[i]].subcarpetas;
  }
  return nodo;
}

/* 📂 obtener nodo actual */
function getNodoActual() {
  let nodo = estructura;
  rutaActual.forEach(p => {
    nodo = nodo[p].subcarpetas;
  });
  return nodo;
}

/* 🎨 MOSTRAR */
function mostrarCarpeta() {
  let grid = document.getElementById("grid");
  grid.innerHTML = "";

  let nodo = getNodoActual();

  /* 🔙 botón atrás */
  if (rutaActual.length > 0) {
    let back = document.createElement("div");
    back.className = "card carpeta";
    back.innerHTML = "⬅️ Volver";
    back.onclick = () => {
      rutaActual.pop();
      mostrarCarpeta();
    };
    grid.appendChild(back);
  }

  /* 📁 SUBCARPETAS */
  Object.keys(nodo).forEach(nombre => {
    let div = document.createElement("div");
    div.className = "card carpeta";

    div.innerHTML = `
      <div class="titulo">📁 ${nombre}</div>
    `;

    div.onclick = () => {
      rutaActual.push(nombre);
      mostrarCarpeta();
    };

    grid.appendChild(div);
  });

  /* 📄 ARCHIVOS */
  let nodoPadre = getNodoPadre([...rutaActual, "temp"]);
  let nombreActual = rutaActual[rutaActual.length - 1];

  if (nombreActual && nodoPadre[nombreActual]) {
    nodoPadre[nombreActual].archivos.forEach(p => {
      let div = document.createElement("div");
      div.className = "card archivo";

      div.innerHTML = `
        <div class="titulo">${p.titulo}</div>
        <div class="compositor">${p.compositor || ""}</div>
      `;

      div.onclick = () => verPDF(p.url);

      grid.appendChild(div);
    });
  }
}

/* 🔎 BUSCADOR GLOBAL (no rompe carpetas) */
document.getElementById("buscador").addEventListener("input", () => {
  let texto = document.getElementById("buscador").value.toLowerCase();

  if (!texto) {
    mostrarCarpeta();
    return;
  }

  let grid = document.getElementById("grid");
  grid.innerHTML = "";

  data
    .filter(p => (p.titulo + " " + p.compositor).toLowerCase().includes(texto))
    .slice(0, 200)
    .forEach(p => {
      let div = document.createElement("div");
      div.className = "card archivo";

      div.innerHTML = `
        <div class="titulo">${p.titulo}</div>
        <div class="compositor">${p.compositor || ""}</div>
      `;

      div.onclick = () => verPDF(p.url);

      grid.appendChild(div);
    });
});

/* 📑 VISOR PDF */
function verPDF(url) {
  let match = url.match(/\/d\/(.*?)\//);

  if (match) {
    document.getElementById("pdfFrame").src =
      "https://drive.google.com/file/d/" + match[1] + "/preview";
  } else {
    document.getElementById("pdfFrame").src = url;
  }
}
</script>
</body>
</html>
