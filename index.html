<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Biblioteca de Partituras</title>
<link rel="stylesheet" href="estilos.css">
</head>

<body>

<header>
  <h1>🎼 Biblioteca de Partituras</h1>
  <input type="text" id="buscador" placeholder="Buscar...">
  <div id="ruta"></div>
</header>

<div class="container">

  <!-- 📂 EXPLORADOR -->
  <div class="explorador">
    <button id="btnAtras">⬅ Volver</button>
    <div id="lista"></div>
  </div>

  <!-- 📑 VISOR -->
  <div class="visor">
    <iframe id="pdfFrame"></iframe>
  </div>

</div>

<script>
let data = [];
let estructura = {};
let rutaActual = [];
let carpetaActual = null;

/* 📦 CARGAR JSON */
fetch('data.json')
  .then(res => {
    console.log("STATUS:", res.status);
    if (!res.ok) throw new Error("No carga JSON");
    return res.json();
  })
  .then(json => {
    console.log("JSON OK:", json.length);
    data = json;
    construirEstructura();
    render();
  })
  .catch(err => {
    console.error("ERROR REAL:", err);
    document.getElementById("lista").innerHTML = "Error cargando datos";
  });

/* 🧠 CONSTRUIR ÁRBOL */
function construirEstructura() {
  estructura = {};

  data.forEach(p => {
    let partes = (p.carpeta || "General").split("/");

    let nivel = estructura;

    partes.forEach(parte => {
      if (!nivel[parte]) {
        nivel[parte] = { _archivos: [], _sub: {} };
      }
      nivel = nivel[parte]._sub;
    });

    // meter archivo en el último nivel
    let ultimo = partes[partes.length - 1];
    let ref = estructura;
    partes.forEach(parte => {
      ref = ref[parte];
      if (parte !== ultimo) ref = ref._sub;
    });

    ref._archivos.push(p);
  });
}

/* 📂 OBTENER NIVEL ACTUAL */
function getNivel() {
  let nivel = estructura;

  rutaActual.forEach(p => {
    nivel = nivel[p]._sub;
  });

  return nivel;
}

/* 🎨 RENDER */
function render() {
  let cont = document.getElementById("lista");
  cont.innerHTML = "";

  let nivel = getNivel();

  // 📁 CARPETAS
  Object.keys(nivel).forEach(nombre => {
    let div = document.createElement("div");
    div.className = "item carpeta";
    div.textContent = "📁 " + nombre;

    div.onclick = () => {
      rutaActual.push(nombre);
      render();
    };

    cont.appendChild(div);
  });

  // 📄 ARCHIVOS
  let archivos = obtenerArchivosNivel();

  archivos.forEach(p => {
    let div = document.createElement("div");
    div.className = "item archivo";

    div.innerHTML = `
      <div class="titulo">${p.titulo}</div>
      <div class="compositor">${p.compositor || ""}</div>
    `;

    div.onclick = () => verPDF(p.url);

    cont.appendChild(div);
  });

  actualizarRuta();
}

/* 📄 OBTENER ARCHIVOS */
function obtenerArchivosNivel() {
  let nivel = estructura;

  rutaActual.forEach(p => {
    nivel = nivel[p]._sub;
  });

  let ref = estructura;
  rutaActual.forEach(p => {
    ref = ref[p];
  });

  return ref ? ref._archivos : [];
}

/* 🔙 VOLVER */
document.getElementById("btnAtras").onclick = () => {
  if (rutaActual.length > 0) {
    rutaActual.pop();
    render();
  }
};

/* 📍 RUTA (breadcrumbs) */
function actualizarRuta() {
  let r = document.getElementById("ruta");

  if (rutaActual.length === 0) {
    r.textContent = "📁 Inicio";
  } else {
    r.textContent = "📁 " + rutaActual.join(" / ");
  }
}

/* 🔎 BUSCADOR GLOBAL */
document.getElementById("buscador").addEventListener("input", e => {
  let texto = e.target.value.toLowerCase();

  if (!texto) {
    render();
    return;
  }

  let cont = document.getElementById("lista");
  cont.innerHTML = "";

  data
    .filter(p =>
      (p.titulo + " " + p.compositor).toLowerCase().includes(texto)
    )
    .slice(0, 200)
    .forEach(p => {
      let div = document.createElement("div");
      div.className = "item archivo";

      div.innerHTML = `
        <div class="titulo">${p.titulo}</div>
        <div class="compositor">${p.compositor || ""}</div>
      `;

      div.onclick = () => verPDF(p.url);

      cont.appendChild(div);
    });
});

/* 📑 VISOR */
function verPDF(url) {
  let match = url.match(/\/d\/(.*?)\//);

  if (match) {
    document.getElementById("pdfFrame").src =
      "https://drive.google.com/file/d/" + match[1] + "/preview";
  } else {
    document.getElementById("pdfFrame").src = url;
  }
}
</script>

</body>
</html>
