<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Biblioteca de Partituras</title>

<link rel="stylesheet" href="estilos.css">
</head>

<body>

<header>
  <h1>🎼 Biblioteca de Partituras</h1>
  <input type="text" id="buscador" placeholder="Buscar partituras...">
</header>

<div class="container">

  <!-- GRID -->
  <div class="grid" id="grid"></div>

  <!-- VISOR -->
  <div class="visor">
    <iframe id="pdfFrame"></iframe>
  </div>

</div>

<script>
let data = [];
let filtrado = [];
let pagina = 0;
const porPagina = 40;
let carpetaActual = null;

/* =========================
   📦 CARGA JSON
========================= */
fetch('https://gabrielmedinaempresa05-png.github.io/partituras/data.json')
  .then(res => res.json())
  .then(json => {
    data = json;
    crearArbol();
    aplicarFiltro();
  });

/* =========================
   🌳 CREAR ÁRBOL REAL
========================= */
function crearArbol() {
  const sidebar = document.getElementById("sidebar");
  sidebar.innerHTML = "";

  let arbol = {};

  // construir árbol por rutas completas
  data.forEach(p => {
    let ruta = (p.carpeta || "General").split("/");

    let nivel = arbol;
    let path = "";

    ruta.forEach(parte => {
      path = path ? path + "/" + parte : parte;

      if (!nivel[parte]) {
        nivel[parte] = {
          _path: path,
          _children: {}
        };
      }

      nivel = nivel[parte]._children;
    });
  });

  // render recursivo
  function renderNodo(nodo, contenedor) {
    Object.keys(nodo).sort().forEach(nombre => {

      let item = nodo[nombre];

      let div = document.createElement("div");
      div.className = "folder";

      let header = document.createElement("div");
      header.className = "folder-header";
      header.innerHTML = "▶ 📁 " + nombre;

      let hijos = document.createElement("div");
      hijos.className = "folder-children";
      hijos.style.display = "none";

      header.onclick = (e) => {
        e.stopPropagation();

        let abierto = hijos.style.display === "block";
        hijos.style.display = abierto ? "none" : "block";

        header.innerHTML = (abierto ? "▶" : "▼") + " 📁 " + nombre;

        seleccionarCarpeta(item._path);
      };

      div.appendChild(header);
      div.appendChild(hijos);
      contenedor.appendChild(div);

      renderNodo(item._children, hijos);
    });
  }

  // botón "todas"
  let todas = document.createElement("div");
  todas.className = "folder-header";
  todas.innerHTML = "📁 Todas";
  todas.onclick = () => seleccionarCarpeta(null);

  sidebar.appendChild(todas);

  renderNodo(arbol, sidebar);
}

/* =========================
   📂 SELECCIÓN REAL
========================= */
function seleccionarCarpeta(path) {
  carpetaActual = path;
  pagina = 0;
  aplicarFiltro();
}

/* =========================
   🔎 BUSCADOR
========================= */
document.getElementById("buscador").addEventListener("input", () => {
  pagina = 0;
  aplicarFiltro();
});

/* =========================
   🔎 FILTRO CORRECTO
========================= */
function aplicarFiltro() {
  let texto = document.getElementById("buscador").value.toLowerCase();

  filtrado = data.filter(p => {

    let matchTexto = true;

    // 🔥 SOLO filtra si hay texto
    if (texto !== "") {
      matchTexto = (p.titulo + " " + p.compositor)
        .toLowerCase()
        .includes(texto);
    }

    let matchCarpeta =
      !carpetaActual || p.carpeta === carpetaActual;

    return matchTexto && matchCarpeta;
  });

  render();
}

/* =========================
   🎨 RENDER
========================= */
function render() {
  let grid = document.getElementById("grid");

  if (pagina === 0) grid.innerHTML = "";

  if (filtrado.length === 0) {
    grid.innerHTML = "<p>No hay resultados</p>";
    return;
  }

  let inicio = pagina * porPagina;
  let fin = inicio + porPagina;

  filtrado.slice(inicio, fin).forEach(p => {
    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="titulo">${p.titulo || "Sin título"}</div>
      <div class="compositor">${p.compositor || ""}</div>
    `;

    div.onclick = () => verPDF(p.url);

    grid.appendChild(div);
  });
}

/* =========================
   ➕ PAGINACIÓN
========================= */
document.getElementById("cargarMas").onclick = () => {
  pagina++;
  render();
};

/* =========================
   📑 VISOR PDF
========================= */
function verPDF(url) {
  let match = url.match(/\/d\/(.*?)\//);

  if (match) {
    document.getElementById("pdfFrame").src =
      "https://drive.google.com/file/d/" + match[1] + "/preview";
  } else {
    document.getElementById("pdfFrame").src = url;
  }
}
</script>


</body>
</html>
