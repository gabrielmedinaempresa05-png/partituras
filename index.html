<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Biblioteca de Partituras</title>

<link rel="stylesheet" href="styles.css">
</head>

<body data-theme="light">

<header>
  <h1>🎼 Biblioteca de Partituras</h1>

  <input type="text" id="buscador" placeholder="Buscar partituras...">

  <button id="themeToggle">🌙 Modo oscuro</button>
</header>

<div class="container">

  <!-- GRID -->
  <div class="grid" id="grid"></div>

  <!-- VISOR -->
  <div class="visor">
    <iframe id="pdfFrame"></iframe>
  </div>

</div>

<script>
let data = [];

/* CARGAR JSON */
fetch('data.json')
  .then(res => res.json())
  .then(json => {
    data = json;
    render(data);
  });

/* RENDER */
function render(lista) {
  let grid = document.getElementById("grid");
  grid.innerHTML = "";

  lista.forEach(p => {

    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="cover">
        🎼
      </div>

      <div class="info">
        <div class="titulo">${p.titulo}</div>
        <div class="compositor">${p.compositor || ""}</div>
      </div>
    `;

    div.onclick = () => verPDF(p.url);

    grid.appendChild(div);
  });
}

/* BUSCADOR */
document.getElementById("buscador").addEventListener("input", function() {
  let v = this.value.toLowerCase();

  let filtrado = data.filter(p =>
    p.titulo.toLowerCase().includes(v) ||
    (p.compositor || "").toLowerCase().includes(v)
  );

  render(filtrado);
});

/* VISOR PDF */
function verPDF(url) {
  let match = url.match(/\/d\/(.*?)\//);

  if (match) {
    document.getElementById("pdfFrame").src =
      "https://drive.google.com/file/d/" + match[1] + "/preview";
  } else {
    document.getElementById("pdfFrame").src = url;
  }
}

/* TEMA */
const btn = document.getElementById("themeToggle");

function setTheme(theme) {
  document.body.setAttribute("data-theme", theme);
  localStorage.setItem("theme", theme);

  btn.textContent = theme === "dark"
    ? "☀️ Modo claro"
    : "🌙 Modo oscuro";
}

let saved = localStorage.getItem("theme") || "light";
setTheme(saved);

btn.onclick = () => {
  let current = document.body.getAttribute("data-theme");
  setTheme(current === "dark" ? "light" : "dark");
};
</script>

</body>
</html>
