<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Biblioteca de Partituras</title>
<link rel="stylesheet" href="estilos.css">
</head>

<body>

<header>
  <h1>🎼 Biblioteca de Partituras</h1>
  <input type="text" id="buscador" placeholder="Buscar partituras...">
</header>

<div class="container">

  <!-- 📄 LISTA -->
  <div class="contenido">
    <div class="grid" id="grid"></div>
    <button id="cargarMas">Cargar más</button>
  </div>

  <!-- 📑 VISOR -->
  <div class="visor">
    <iframe id="pdfFrame"></iframe>
  </div>

</div>

<script>
let data = [];
let filtrado = [];
let pagina = 0;
const porPagina = 40;

/* =========================
   CARGA JSON
========================= */
fetch('./data.json')
  .then(res => res.json())
  .then(json => {
    data = json;
    aplicarFiltro();
  })
  .catch(err => {
    console.error(err);
    document.getElementById("grid").innerHTML = "Error cargando datos";
  });

/* =========================
   BUSCADOR
========================= */
document.getElementById("buscador").addEventListener("input", () => {
  pagina = 0;
  aplicarFiltro();
});

/* =========================
   FILTRO
========================= */
function aplicarFiltro() {
  let texto = document.getElementById("buscador").value.toLowerCase();

  filtrado = data.filter(p => {
    if (!texto) return true;

    return (p.titulo + " " + p.compositor)
      .toLowerCase()
      .includes(texto);
  });

  render();
}

/* =========================
   RENDER
========================= */
function render() {
  let grid = document.getElementById("grid");

  if (pagina === 0) grid.innerHTML = "";

  let inicio = pagina * porPagina;
  let fin = inicio + porPagina;

  filtrado.slice(inicio, fin).forEach((p, i) => {
    let div = document.createElement("div");
    div.className = "card";

    // 🔥 marcar el primero
    if (i === 0 && pagina === 0) {
      div.classList.add("activo");
    }

    div.innerHTML = `
      <div class="titulo">${p.titulo}</div>
      <div class="compositor">${p.compositor || ""}</div>
    `;

    div.onclick = () => {
      document.querySelectorAll(".card").forEach(c => c.classList.remove("activo"));
      div.classList.add("activo");
      verPDF(p.url);
    };

    grid.appendChild(div);
  });

  // 🔥 auto abrir el primero del filtro
  if (filtrado.length > 0 && pagina === 0) {
    verPDF(filtrado[0].url);
  }
}

/* =========================
   CARGAR MÁS
========================= */
document.getElementById("cargarMas").onclick = () => {
  pagina++;
  render();
};

/* =========================
   VISOR PDF
========================= */
function verPDF(url) {
  let match = url.match(/\/d\/(.*?)\//);

  if (match) {
    document.getElementById("pdfFrame").src =
      "https://drive.google.com/file/d/" + match[1] + "/preview";
  } else {
    document.getElementById("pdfFrame").src = url;
  }
}
</script>

</body>
</html>
