<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<title>Biblioteca de Partituras</title>
<link rel="stylesheet" href="estilos.css">
</head>

<body>

<header>
  <h1>🎼 Biblioteca de Partituras</h1>
  <input type="text" id="buscador" placeholder="Buscar...">
  <div id="ruta">📁 Inicio</div>
</header>

<div class="container">

  <!-- 📂 EXPLORADOR -->

  <div class="explorador">
    <button id="btnAtras">⬅ Volver</button>
    <div id="lista"></div>
  </div>

  <!-- 📑 VISOR -->

  <div class="visor">
    <iframe id="pdfFrame"></iframe>
  </div>

</div>

<script>
let data = [];
let estructura = { _archivos: [], _sub: {} };
let rutaActual = [];

/* =========================
   📦 CARGAR JSON
========================= */
fetch('data.json')
  .then(res => res.json())
  .then(json => {
    data = json;
    construirEstructura();
    render();
  })
  .catch(err => {
    console.error(err);
    document.getElementById("lista").innerHTML = "Error cargando datos";
  });

/* =========================
   🧠 CONSTRUIR ÁRBOL
========================= */
function construirEstructura() {
  estructura = { _archivos: [], _sub: {} };

  data.forEach(p => {
    let partes = (p.carpeta || "General").split("/");
    let nodo = estructura;

    partes.forEach(parte => {
      if (!nodo._sub[parte]) {
        nodo._sub[parte] = { _archivos: [], _sub: {} };
      }
      nodo = nodo._sub[parte];
    });

    nodo._archivos.push(p);
  });
}

/* =========================
   📂 OBTENER NIVEL ACTUAL
========================= */
function getNodoActual() {
  let nodo = estructura;

  for (let r of rutaActual) {
    if (!nodo._sub[r]) return null;
    nodo = nodo._sub[r];
  }

  return nodo;
}

/* =========================
   🎨 RENDER
========================= */
function render() {
  let cont = document.getElementById("lista");
  cont.innerHTML = "";

  let nodo = getNodoActual();
  if (!nodo) return;

  /* 📁 CARPETAS */
  Object.keys(nodo._sub).sort().forEach(nombre => {
    let div = document.createElement("div");
    div.className = "item carpeta";
    div.textContent = "📁 " + nombre;

    div.onclick = () => {
      rutaActual.push(nombre);
      render();
    };

    cont.appendChild(div);
  });

  /* 📄 ARCHIVOS */
  nodo._archivos.forEach(p => {
    let div = document.createElement("div");
    div.className = "item archivo";

    div.innerHTML = `
      <div class="titulo">${p.titulo}</div>
      <div class="compositor">${p.compositor || ""}</div>
    `;

    div.onclick = () => verPDF(p.url);

    cont.appendChild(div);
  });

  actualizarRuta();
}

/* =========================
   🔙 VOLVER
========================= */
document.getElementById("btnAtras").onclick = () => {
  if (rutaActual.length > 0) {
    rutaActual.pop();
    render();
  }
};

/* =========================
   📍 RUTA
========================= */
function actualizarRuta() {
  let r = document.getElementById("ruta");

  if (rutaActual.length === 0) {
    r.textContent = "📁 Inicio";
  } else {
    r.textContent = "📁 " + rutaActual.join(" / ");
  }
}

/* =========================
   🔎 BUSCADOR
========================= */
document.getElementById("buscador").addEventListener("input", e => {
  let texto = e.target.value.toLowerCase();

  if (!texto) {
    render();
    return;
  }

  let cont = document.getElementById("lista");
  cont.innerHTML = "";

  data
    .filter(p =>
      (p.titulo + " " + p.compositor).toLowerCase().includes(texto)
    )
    .slice(0, 200)
    .forEach(p => {
      let div = document.createElement("div");
      div.className = "item archivo";

      div.innerHTML = `
        <div class="titulo">${p.titulo}</div>
        <div class="compositor">${p.compositor || ""}</div>
      `;

      div.onclick = () => verPDF(p.url);

      cont.appendChild(div);
    });

  document.getElementById("ruta").textContent = "🔎 Resultados";
});

/* =========================
   📑 VISOR PDF
========================= */
function verPDF(url) {
  let match = url.match(/\/d\/(.*?)\//);

  if (match) {
    document.getElementById("pdfFrame").src =
      "https://drive.google.com/file/d/" + match[1] + "/preview";
  } else {
    document.getElementById("pdfFrame").src = url;
  }
}
</script>

</body>
</html>
