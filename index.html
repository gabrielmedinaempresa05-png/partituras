<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Biblioteca de Partituras</title>
<link rel="stylesheet" href="estilos.css">
</head>

<body>

<header>
  <h1>🎼 Biblioteca de Partituras</h1>
  <input type="text" id="buscador" placeholder="Buscar...">
</header>

<div class="container">

  <!-- 📂 SIDEBAR -->
  <div class="sidebar" id="sidebar"></div>

  <!-- 📄 CONTENIDO -->
  <div class="contenido">
    <div class="grid" id="grid"></div>
    <button id="cargarMas">Cargar más</button>
  </div>

  <!-- 📑 VISOR -->
  <div class="visor">
    <iframe id="pdfFrame"></iframe>
  </div>

</div>

<script>
let data = [];
let filtrado = [];
let pagina = 0;
const porPagina = 40;
let carpetaActual = null;

/* 📦 CARGA */
fetch('data.json')
  .then(res => {
    if (!res.ok) throw new Error("No carga JSON");
    return res.json();
  })
  .then(json => {
    console.log("JSON cargado:", json.length);

    data = json;

    crearCarpetas();
    aplicarFiltro();
  })
  .catch(err => {
    console.error("ERROR:", err);
    document.getElementById("grid").innerHTML = "Error cargando datos";
  });

/* 📂 CREAR SIDEBAR */
function crearCarpetas() {
  let sidebar = document.getElementById("sidebar");

  let carpetas = [...new Set(data.map(p => p.carpeta || "General"))];

  sidebar.innerHTML = "";

  let todas = document.createElement("div");
  todas.textContent = "📁 Todas";
  todas.onclick = () => seleccionarCarpeta(null);
  sidebar.appendChild(todas);

  carpetas.forEach(c => {
    let div = document.createElement("div");
    div.textContent = "📁 " + c;
    div.onclick = () => seleccionarCarpeta(c);
    sidebar.appendChild(div);
  });
}

/* 📂 SELECCIONAR CARPETA */
function seleccionarCarpeta(carpeta) {
  carpetaActual = carpeta;
  pagina = 0;
  aplicarFiltro();
}

/* 🔎 BUSCADOR */
document.getElementById("buscador").addEventListener("input", () => {
  pagina = 0;
  aplicarFiltro();
});

/* 🔎 FILTRAR (CORREGIDO) */
function aplicarFiltro() {
  let texto = document.getElementById("buscador").value.toLowerCase();

  filtrado = data.filter(p => {

    let titulo = (p.titulo || "").toLowerCase();
    let comp = (p.compositor || "").toLowerCase();
    let carpeta = (p.carpeta || "");

    let matchTexto = (titulo + " " + comp).includes(texto);
    let matchCarpeta = !carpetaActual || carpeta === carpetaActual;

    return matchTexto && matchCarpeta;
  });

  console.log("Filtrado:", filtrado.length);

  render();
}

/* 🎨 RENDER (MEJORADO) */
function render() {
  let grid = document.getElementById("grid");

  if (pagina === 0) grid.innerHTML = "";

  if (filtrado.length === 0) {
    grid.innerHTML = "<p>No hay resultados</p>";
    return;
  }

  let inicio = pagina * porPagina;
  let fin = inicio + porPagina;

  filtrado.slice(inicio, fin).forEach(p => {
    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="titulo">${p.titulo || "Sin título"}</div>
      <div class="compositor">${p.compositor || ""}</div>
    `;

    div.onclick = () => verPDF(p.url);

    grid.appendChild(div);
  });
}

/* ➕ CARGAR MÁS */
document.getElementById("cargarMas").onclick = () => {
  pagina++;
  render();
};

/* 📑 VISOR PDF */
function verPDF(url) {
  let match = url.match(/\/d\/(.*?)\//);

  if (match) {
    document.getElementById("pdfFrame").src =
      "https://drive.google.com/file/d/" + match[1] + "/preview";
  } else {
    document.getElementById("pdfFrame").src = url;
  }
}
</script>

</body>
</html>
