<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Biblioteca de Partituras</title>

<link rel="stylesheet" href="estilos.css">
</head>

<body>

<header>
  <h1>🎼 Biblioteca de Partituras</h1>
  <input type="text" id="buscador" placeholder="Buscar partituras...">
</header>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar"></div>

  <!-- GRID -->
  <div class="grid" id="grid"></div>

  <!-- VISOR -->
  <div class="visor">
    <iframe id="pdfFrame"></iframe>
  </div>

</div>

<script>
let data = [];
let estructura = {};

fetch('https://gabrielmedinaempresa05-png.github.io/partituras/data.json')
  .then(res => res.json())
  .then(json => {
    data = json;

    construirEstructura();
    renderCarpetas();
    render(data);
  });

/* 📁 CONSTRUIR ÁRBOL DE CARPETAS */
function construirEstructura() {
  estructura = {};

  data.forEach(p => {
    let ruta = p.carpeta || "";
    let partes = ruta.split("/").filter(x => x);

    let nivel = estructura;

    partes.forEach(parte => {
      if (!nivel[parte]) nivel[parte] = {};
      nivel = nivel[parte];
    });
  });
}

/* 📁 RENDER SIDEBAR */
function renderCarpetas() {
  let sidebar = document.getElementById("sidebar");
  sidebar.innerHTML = "<h3>📂 Carpetas</h3>";

  function crearLista(obj, ruta = "") {
    let ul = document.createElement("ul");

    for (let key in obj) {
      let li = document.createElement("li");
      li.textContent = key;

      let nuevaRuta = ruta + "/" + key;

      li.onclick = (e) => {
        e.stopPropagation();

        let filtrado = data.filter(p =>
          (p.carpeta || "").startsWith(nuevaRuta)
        );

        render(filtrado);
      };

      li.appendChild(crearLista(obj[key], nuevaRuta));
      ul.appendChild(li);
    }

    return ul;
  }

  sidebar.appendChild(crearLista(estructura));
}

/* 🎼 GRID */
function render(lista) {
  let grid = document.getElementById("grid");
  grid.innerHTML = "";

  lista.forEach(p => {
    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="titulo">${p.titulo}</div>
      <div class="compositor">${p.compositor || ""}</div>
    `;

    div.onclick = () => verPDF(p.url);

    grid.appendChild(div);
  });
}

/* 🔍 BUSCADOR */
document.getElementById("buscador").addEventListener("input", function() {
  let v = this.value.toLowerCase();

  let filtrado = data.filter(p =>
    p.titulo.toLowerCase().includes(v) ||
    (p.compositor || "").toLowerCase().includes(v)
  );

  render(filtrado);
});

/* 📄 VISOR PDF */
function verPDF(url) {
  let match = url.match(/\/d\/(.*?)\//);

  if (match) {
    document.getElementById("pdfFrame").src =
      "https://drive.google.com/file/d/" + match[1] + "/preview";
  } else {
    document.getElementById("pdfFrame").src = url;
  }
}
</script>
</body>
</html>
