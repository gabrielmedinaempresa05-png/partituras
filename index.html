<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Biblioteca de Partituras</title>
<link rel="stylesheet" href="estilos.css">
</head>

<body>

<header>
  <h1>🎼 Biblioteca de Partituras</h1>
  <input type="text" id="buscador" placeholder="Buscar partitura...">
</header>

<div class="container">

  <div class="grid" id="grid"></div>

  <div class="visor">
    <iframe id="pdfFrame"></iframe>
  </div>

</div>

<button id="cargarMas">Cargar más</button>

<script>
let data = [];
let filtrado = [];
let pagina = 0;
const porPagina = 60;

/* 📦 CARGAR JSON */
fetch('./data.json?v=' + Date.now())
  .then(res => res.json())
  .then(json => {
    data = json;
    filtrado = data;
    render();
  })
  .catch(err => {
    console.error(err);
    document.getElementById("grid").innerHTML = "❌ Error cargando datos";
  });

/* 🔎 BUSCADOR */
document.getElementById("buscador").addEventListener("input", () => {
  let texto = document.getElementById("buscador").value.toLowerCase();

  filtrado = data.filter(p =>
    (p.titulo + " " + p.compositor + " " + (p.carpeta || ""))
      .toLowerCase()
      .includes(texto)
  );

  pagina = 0;
  document.getElementById("grid").innerHTML = "";
  render();
});

/* 🎨 RENDER */
function render() {
  let grid = document.getElementById("grid");

  let inicio = pagina * porPagina;
  let fin = inicio + porPagina;

  filtrado.slice(inicio, fin).forEach(p => {
    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="titulo">${p.titulo}</div>
      <div class="compositor">${p.compositor || ""}</div>
      <div class="ruta">${p.carpeta || ""}</div>
    `;

    div.onclick = () => verPDF(p.url);

    grid.appendChild(div);
  });
}

/* ➕ CARGAR MÁS */
document.getElementById("cargarMas").onclick = () => {
  pagina++;
  render();
};

/* 📑 VISOR PDF */
function verPDF(url) {
  let match = url.match(/\/d\/(.*?)\//);

  if (match) {
    document.getElementById("pdfFrame").src =
      "https://drive.google.com/file/d/" + match[1] + "/preview";
  } else {
    document.getElementById("pdfFrame").src = url;
  }
}
</script>

</body>
</html>
