<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Biblioteca de Partituras</title>

<link rel="stylesheet" href="estilos.css">

<style>
.container {
  display: flex;
}

.sidebar {
  width: 250px;
  overflow-y: auto;
  border-right: 1px solid #ccc;
  padding: 10px;
}

.sidebar ul {
  list-style: none;
  padding-left: 15px;
}

.sidebar li {
  cursor: pointer;
  margin: 5px 0;
}

.sidebar li:hover {
  color: #0077ff;
}

.grid {
  flex: 1;
  display: flex;
  flex-wrap: wrap;
  padding: 10px;
}

.card {
  width: 180px;
  padding: 10px;
  margin: 5px;
  border: 1px solid #ccc;
  cursor: pointer;
}

.visor {
  width: 40%;
}

iframe {
  width: 100%;
  height: 600px;
}
</style>
</head>

<body>

<header>
  <h1>🎼 Biblioteca de Partituras</h1>
  <input type="text" id="buscador" placeholder="Buscar partituras...">
</header>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar"></div>

  <!-- GRID -->
  <div class="grid" id="grid"></div>

  <!-- VISOR -->
  <div class="visor">
    <iframe id="pdfFrame"></iframe>
  </div>

</div>

<script>
let data = [];
let estructura = {};
let pagina = 0;
let porPagina = 100;

/* 🔥 FETCH CORRECTO (TU CASO) */
fetch('https://gabrielmedinaempresa05-png.github.io/partituras/data.json')
  .then(res => res.json())
  .then(json => {
    console.log("Cargados:", json.length);

    data = json;

    construirEstructura();
    renderCarpetas();
    render(data);
  })
  .catch(err => console.error("Error cargando JSON:", err));

/* 📁 CONSTRUIR ÁRBOL */
function construirEstructura() {
  estructura = {};

  data.forEach(p => {
    let ruta = p.carpeta || "Sin categoría";
    let partes = ruta.split("/").filter(x => x);

    let nivel = estructura;

    partes.forEach(parte => {
      if (!nivel[parte]) nivel[parte] = {};
      nivel = nivel[parte];
    });
  });
}

/* 📁 SIDEBAR */
function renderCarpetas() {
  let sidebar = document.getElementById("sidebar");
  sidebar.innerHTML = "<h3>📂 Carpetas</h3>";

  function crearLista(obj, ruta = "") {
    let ul = document.createElement("ul");

    for (let key in obj) {
      let li = document.createElement("li");
      li.textContent = key;

      let nuevaRuta = ruta ? ruta + "/" + key : key;

      li.onclick = (e) => {
        e.stopPropagation();
        pagina = 0;

        let filtrado = data.filter(p =>
          (p.carpeta || "").startsWith(nuevaRuta)
        );

        render(filtrado);
      };

      li.appendChild(crearLista(obj[key], nuevaRuta));
      ul.appendChild(li);
    }

    return ul;
  }

  sidebar.appendChild(crearLista(estructura));
}

/* 🎼 GRID OPTIMIZADO */
function render(lista) {
  let grid = document.getElementById("grid");
  grid.innerHTML = "";

  let inicio = pagina * porPagina;
  let fin = inicio + porPagina;

  lista.slice(inicio, fin).forEach(p => {
    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="titulo">${p.titulo}</div>
      <div class="compositor">${p.compositor || ""}</div>
    `;

    div.onclick = () => verPDF(p.url);

    grid.appendChild(div);
  });
}

/* 🔍 BUSCADOR */
document.getElementById("buscador").addEventListener("input", function() {
  let v = this.value.toLowerCase();
  pagina = 0;

  let filtrado = data.filter(p =>
    p.titulo.toLowerCase().includes(v) ||
    (p.compositor || "").toLowerCase().includes(v)
  );

  render(filtrado);
});

/* 📄 VISOR PDF */
function verPDF(url) {
  let match = url.match(/\/d\/(.*?)\//);

  if (match) {
    document.getElementById("pdfFrame").src =
      "https://drive.google.com/file/d/" + match[1] + "/preview";
  } else {
    document.getElementById("pdfFrame").src = url;
  }
}
</script>

</body>
</html>
